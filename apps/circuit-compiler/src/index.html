<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthereumX Crypto Service Worker</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.umd.min.js"></script>
</head>
<body>
    <h1>EthereumX Crypto Service Worker</h1>
    <button id="register">Register Service Worker</button>
    <button id="fetch-data">Fetch Data</button>
    <button id="interact-contract">Interact with Contract</button>
    <div id="output"></div>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous"/> -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"> -->
    <link rel="stylesheet" integrity="ha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf"
		crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
  </head>
  <body>
    <div id="root"></div>
     <script src="script.js"></script>
     <script src="">   </script>
    <script src="https://kit.fontawesome.com/41dd021e94.js" crossorigin="anonymous"></script>
     <script>
        // Register the service worker
        document.getElementById('register').addEventListener('click', async () => {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('service-worker.js');
                    console.log('Service Worker registered with scope:', registration.scope);
                } catch (error) {
                    console.error('Service Worker registration failed:', error);
                }
            } else {
                console.log('Service workers are not supported in this browser.');
            }
        });

        // Fetch data from the service worker
        document.getElementById('fetch-data').addEventListener('click', async () => {
            if (navigator.serviceWorker.controller) {
                const response = await fetch('/data');
                const data = await response.json();
                document.getElementById('output').innerText = JSON.stringify(data);
            } else {
                console.log('No active service worker found.');
            }
        });
    </script>

  </body>
</html>
